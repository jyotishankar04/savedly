<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Savedly</title>
    <style>
      /* The popup is 320px wide and Chrome caps it at 600px tall. The body
         scrolls itself within those, so a scrollbar takes its room from the
         content (which narrows to fit) and never pushes it past the right edge. */
      html {
        overflow: hidden;
      }
      body {
        margin: 0;
        width: 320px;
        max-height: 600px;
        overflow-x: hidden;
        overflow-y: auto;
        background-color: #ffffff;
        color: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .sv-row:hover { background: #f4f4f6; }
      .sv-row:hover .sv-row-actions, .sv-row:focus-within .sv-row-actions { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
