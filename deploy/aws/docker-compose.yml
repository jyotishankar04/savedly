# The API on a single small instance (AWS t3.small).
# The image is built by .github/workflows/cd.yml and pulled from GHCR, so the
# instance never builds. Redis runs here too; Postgres, the vector store and
# file storage are external services named in .env.prod.
# Full runbook: docs/DEPLOY_AWS.md
#
# On the instance this file lives in /opt/saveforlatter next to .env.prod,
# and Caddyfile. Start or update with:
#
#   IMAGE_TAG=<commit sha> docker compose pull && docker compose up -d

name: saveforlatter-api

services:
  server:
    image: ghcr.io/jyotishankar04/saveforlatter-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      SELF_HOSTED: "false"
      RUN_MIGRATIONS: "true"
      PORT: "4000"
      # One proxy sits in front of the API: Caddy.
      TRUST_PROXY: "1"
      # The Redis below. Set here so it wins over any REDIS_URL in .env.prod.
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    # No published port: only Caddy reaches the API, over the compose network.
    expose:
      - "4000"
    mem_limit: 1400m
    stop_grace_period: 15s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Job queues and the response cache. On the instance because the workers
  # poll constantly, which burns through a hosted free plan's request quota,
  # and because it is then a fraction of a millisecond from the API.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # - appendonly: queued jobs survive a restart.
    # - noeviction: BullMQ needs it; a full Redis must refuse writes rather
    #   than silently drop queued jobs. Cache entries expire by themselves.
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
    # No published port: only the API reaches it, over the compose network.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # 80 is for the Let's Encrypt check and the redirect to HTTPS.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy keeps its certificates here; losing it only means re-issuing them.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging

volumes:
  redis_data:
  caddy_data:
  caddy_config:
