<!doctype html>
<!--
  The social share image (app/opengraph-image.png and app/twitter-image.png,
  the same file). Edit here, then render at 1200x630 with a 2x device scale in
  Chromium and scale the screenshot down to 1200x630, e.g. with Playwright:
    page.setViewportSize 1200x630, deviceScaleFactor 2, goto file://…/og.html,
    await document.fonts.ready, screenshot; magick og@2x.png -resize 1200x630 -strip out.png
  Uses the site's own fonts (app/fonts), the landing hero (public/hero-bg-light.webp)
  and the real app's Search screen (public/landing/app-search-dark.webp).
  Update app/opengraph-image.alt.txt and twitter-image.alt.txt if the picture changes.
-->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Newsreader; src: url(../app/fonts/newsreader-latin.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: Geist; src: url(../app/fonts/geist-latin.woff2) format("woff2"); font-weight: 100 900; }
:root { --brand: #2F5BFF; --ink: #0E0F12; --paper: #F8F8F6; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); font-family: Geist, sans-serif; color: var(--ink); }

/* The dawn salt flat from the landing hero, rising from the bottom edge. */
.ground { position: absolute; inset: auto 0 0 0; height: 250px; background: url(../public/hero-bg-light.webp) center 78% / 1200px auto no-repeat;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 80%); mask-image: linear-gradient(to bottom, transparent 0%, #000 80%); opacity: .9; }
/* Quieter on the left, behind the logo. */
.calm { position: absolute; inset: auto 0 0 0; height: 250px; background: linear-gradient(to right, rgba(248,248,246,.78), rgba(248,248,246,.35) 45%, transparent 62%); }
/* Blue haze under the app, the brand colour in the light. */
.haze { position: absolute; left: 470px; right: -200px; bottom: -150px; height: 360px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(61,123,255,.55), rgba(61,123,255,.18) 55%, transparent); filter: blur(28px); }
.warm { position: absolute; left: -120px; bottom: -170px; width: 640px; height: 320px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,196,160,.55), transparent); filter: blur(30px); }

h1 { position: absolute; left: 56px; top: 50px; width: 520px; font-family: Newsreader, serif; font-weight: 400; font-size: 66px; line-height: 1.04; letter-spacing: -0.025em; }

.ticks { position: absolute; left: 556px; top: 262px; display: grid; gap: 51px; }
.ticks i { display: block; width: 22px; height: 1.5px; background: rgba(14,15,18,.22); }

.app { position: absolute; left: 640px; top: 56px; width: 1060px; height: 660px; border-radius: 18px; overflow: hidden;
  background: #0B0B0D url(../public/landing/app-search-dark.webp) 0 0 / 1060px auto no-repeat;
  box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset, 0 30px 80px -20px rgba(10,20,60,.45), 0 0 0 1px rgba(14,15,18,.12);
  -webkit-mask-image: linear-gradient(to bottom, #000 42%, rgba(0,0,0,.35) 64%, transparent 84%); mask-image: linear-gradient(to bottom, #000 42%, rgba(0,0,0,.35) 64%, transparent 84%); }

/* Specks of light in the glow. */
.specks { position: absolute; inset: 0; pointer-events: none; }
.specks b { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 6px 1px rgba(255,255,255,.9); }

.brand { position: absolute; left: 56px; bottom: 50px; display: flex; align-items: center; gap: 14px; font-family: Geist, sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.03em; }
.brand svg { width: 66px; height: 66px; margin: -12px -6px -12px -10px; }
.brand .ly { color: var(--brand); font-weight: 500; }
</style></head>
<body><div class="og">
  <div class="ground"></div><div class="calm"></div><div class="warm"></div><div class="haze"></div>
  <h1>Save it now,<br>find it later.</h1>
  <div class="ticks"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="app"></div>
  <div class="specks" id="specks"></div>
  <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#0B3FE3"/>
    </linearGradient>
    <linearGradient id="f" x1="50" y1="50" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E6EEFF"/>
      <stop offset="1" stop-color="#9DB9FF"/>
    </linearGradient>
  </defs>
  <g transform="translate(13.5 28) rotate(-12 40 40)">
    <rect width="80" height="80" rx="20" fill="url(#b)"/>
    <path d="M80 40C73 50 60 50 54 57C47 65 50 74 43 80H60A20 20 0 0 0 80 60Z" fill="url(#f)"/>
    <path d="M18.5 38A6.5 6.5 0 0 1 31.5 38M44.5 38A6.5 6.5 0 0 1 57.5 38" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path d="M88 6L95 -4M92 18L102 11" stroke="#2F6BFF" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg><span>saved<span class="ly">ly</span></span></div>
</div>
<script>
  // Fixed positions (no randomness), so every render is the same.
  const specks = [[700,560,2.2],[742,598,1.6],[790,540,1.4],[836,585,2.4],[880,612,1.5],[925,552,1.8],[968,596,1.3],[1010,570,2.1],[1056,608,1.6],[1100,548,1.4],[1142,590,2],[1180,560,1.3],[1000,520,1.2],[860,520,1.1],[760,512,1.3],[1120,512,1.1],[640,600,1.4],[590,575,1.1]];
  document.getElementById("specks").innerHTML = specks.map(([x,y,r]) => `<b style="left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px;opacity:${0.55 + (r-1)/3}"></b>`).join("");
</script>
</body></html>
