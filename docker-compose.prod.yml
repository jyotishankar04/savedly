# Hosted production app containers. Postgres and Redis are external services;
# their connection URLs and application credentials come from server/.env.prod.
# Start with: docker compose --env-file server/.env.prod -f docker-compose.prod.yml up -d --build

name: saveforlatter-prod

services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    init: true
    env_file:
      - ./server/.env.prod
    environment:
      NODE_ENV: production
      SELF_HOSTED: "false"
      RUN_MIGRATIONS: "true"
      PORT: "4000"
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in server/.env.prod}
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL in server/.env.prod}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000"
    stop_grace_period: 15s

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ${SERVER_URL:?Set SERVER_URL in server/.env.prod}/api/v1
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/', response => process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
